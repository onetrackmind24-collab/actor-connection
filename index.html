<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actor Connection</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f3f3f3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#101010 0 230px,#f3f3f3 230px)}.app{max-width:760px;margin:auto;padding:18px}.hero{color:white;padding:8px 0 22px}.hero h1{margin:0;font-size:28px}.hero p{opacity:.75;margin:6px 0}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 8px 30px #00000012}.actors{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.person{text-align:center}.pic{width:92px;height:112px;border-radius:16px;object-fit:cover;background:#ddd}.name{font-size:19px;font-weight:800;margin-top:6px}.label{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:#777}.vs{font-weight:900;color:#aaa}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:18px;border-top:1px solid #eee;padding-top:14px}.stats b{font-size:20px;display:block}.stats span{font-size:11px;color:#777}.field{position:relative;margin-top:12px}.field input{width:100%;font-size:17px;padding:14px;border:1px solid #ccc;border-radius:12px}.drop{position:absolute;z-index:20;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:12px;max-height:270px;overflow:auto;box-shadow:0 10px 25px #0002}.opt{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee;cursor:pointer}.opt img{width:38px;height:50px;object-fit:cover;border-radius:7px;background:#ddd}.opt b{display:block}.opt small{color:#777}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.btn{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee}.msg{margin-top:12px;padding:12px;border-radius:12px;font-weight:700}.bad{background:#fff0f0;color:#9d1818}.ok{background:#eaf7ed;color:#176b2c}.hint{background:#fff7d6;color:#6e5500}.route{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.node{background:#eee;border-radius:9px;padding:8px 10px;font-weight:700}.movie{font-size:12px;color:#666}.hidden{display:none}.note{font-size:12px;line-height:1.45;color:#777;margin-top:12px}@media(max-width:520px){.pic{width:74px;height:92px}.name{font-size:16px}.card{padding:16px}}
</style></head><body><div class="app"><div class="hero"><h1>ACTOR CONNECTION</h1><p>Connect the starting actor to the weekly target in six degrees or fewer.</p></div>
<section class="card" id="loading"><div class="label">Choose difficulty</div><h2 id="loadTitle">Actor Connection</h2><p id="loadText">Pick a level to start.</p><div class="row"><button class="btn secondary difficulty" data-difficulty="beginner">Beginner</button><button class="btn secondary difficulty" data-difficulty="intermediate">Intermediate</button></div><button class="btn primary difficulty" data-difficulty="expert" style="width:100%;margin-top:10px">Expert</button></section>
<section class="card hidden" id="game"><div class="actors"><div class="person"><div class="label">Starting actor</div><img class="pic" id="startPic"><div class="name" id="startName"></div></div><div class="vs">→</div><div class="person"><div class="label">Weekly target</div><img class="pic" id="targetPic"><div class="name" id="targetName"></div></div></div><div class="stats"><div><b id="degrees">0</b><span>degrees</span></div><div><b id="left">6</b><span>left</span></div><div><b id="hints">0</b><span>hints</span></div><div><b id="time">00:00</b><span>time</span></div></div></section>
<section class="card hidden" id="play"><div class="label">Current actor</div><div style="display:flex;align-items:center;gap:12px;margin-top:8px"><img class="pic" id="currentPic" style="width:62px;height:76px"><h2 id="currentName" style="margin:0"></h2></div><div class="field"><input id="movieInput" placeholder="Start typing a movie…" autocomplete="off"><div class="drop hidden" id="movieDrop"></div></div><div class="field"><input id="actorInput" placeholder="Start typing the connecting actor…" autocomplete="off" disabled><div class="drop hidden" id="actorDrop"></div></div><div class="row"><button class="btn primary" id="connect">Make connection</button><button class="btn secondary" id="back">Backtrack</button></div><div class="row"><button class="btn secondary" id="hint1">Hint 1: Movie</button><button class="btn secondary" id="hint2">Hint 2: Actor</button></div><button class="btn secondary" id="giveUp" style="width:100%;margin-top:10px">Give up</button><div id="message"></div></section>
<section class="card hidden" id="routeCard"><div class="label">Your route</div><div class="route" id="route" style="margin-top:12px"></div></section>
<section class="card hidden" id="result"><div class="label">Round complete</div><h2 id="resultTitle"></h2><div id="resultText"></div><button class="btn primary" style="margin-top:14px" onclick="location.reload()">Play again</button></section>
</div><script>
const IMG='https://image.tmdb.org/t/p/w185',qs=id=>document.getElementById(id);let start,target,current,puzzleId=null,degree=0,hints=0,seconds=0,timer,route=[],selectedMovie,selectedActor,hintedPath=null,movieSeq=0,actorSeq=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){let r=await fetch(url);let d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Request failed');return d}function img(p){return p?IMG+p:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="185" height="240"><rect width="100%" height="100%" fill="#ddd"/><text x="50%" y="50%" text-anchor="middle" fill="#777" font-size="18">No photo</text></svg>')}async function person(n){return get('/api/person?name='+encodeURIComponent(n))}async function movieSearch(q){return get('/api/autocomplete/movies?puzzle_id='+encodeURIComponent(puzzleId)+'&q='+encodeURIComponent(q))}async function actorSearch(mid,q){return get('/api/autocomplete/actors?puzzle_id='+encodeURIComponent(puzzleId)+'&movie_id='+encodeURIComponent(mid)+'&q='+encodeURIComponent(q))}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function stats(){qs('degrees').textContent=degree;qs('left').textContent=6-degree;qs('hints').textContent=hints;qs('time').textContent=fmt(seconds)}function msg(t,c='hint'){qs('message').innerHTML='<div class="msg '+c+'">'+esc(t)+'</div>'}function renderRoute(){qs('route').innerHTML=route.map((r,i)=>(i?' <span>→</span> ':'')+'<span class="node">'+esc(r.actor.name)+'</span>'+(r.movie?' <span class="movie">'+esc(r.movie.title)+'</span>':'')).join('')}
async function loadCurrent(){selectedMovie=selectedActor=null;hintedPath=null;qs('currentName').textContent=current.name;qs('currentPic').src=img(current.profile_path);qs('movieInput').value='';qs('actorInput').value='';qs('actorInput').disabled=true;qs('movieDrop').classList.add('hidden');qs('actorDrop').classList.add('hidden');stats();renderRoute()}
function showDrop(el,items,kind){if(!items.length){el.classList.add('hidden');return}el.innerHTML=items.slice(0,12).map((x,i)=>'<div class="opt" data-i="'+i+'"><img src="'+img(kind==='movie'?x.poster_path:x.profile_path)+'"><div><b>'+esc(kind==='movie'?x.title:x.name)+'</b><small>'+(kind==='movie'?esc((x.release_date||'').slice(0,4)):esc(x.character||''))+'</small></div></div>').join('');el.classList.remove('hidden');[...el.children].forEach((n,i)=>n.onclick=()=>kind==='movie'?chooseMovie(items[i]):chooseActor(items[i]))}
qs('movieInput').oninput=async()=>{let q=qs('movieInput').value.trim();selectedMovie=selectedActor=null;qs('actorInput').disabled=true;qs('actorDrop').classList.add('hidden');let seq=++movieSeq;if(!q){showDrop(qs('movieDrop'),[],'movie');return}try{let matches=await movieSearch(q);if(seq===movieSeq)showDrop(qs('movieDrop'),matches,'movie')}catch(e){if(seq===movieSeq)showDrop(qs('movieDrop'),[],'movie')}};async function chooseMovie(m){selectedMovie=m;selectedActor=null;qs('movieInput').value=m.title;qs('movieDrop').classList.add('hidden');qs('actorInput').disabled=false;qs('actorInput').value='';qs('actorInput').focus()}qs('actorInput').oninput=async()=>{let q=qs('actorInput').value.trim();selectedActor=null;let seq=++actorSeq;if(!q||!selectedMovie){showDrop(qs('actorDrop'),[],'actor');return}try{let matches=await actorSearch(selectedMovie.id,q);if(seq===actorSeq)showDrop(qs('actorDrop'),matches,'actor')}catch(e){if(seq===actorSeq)showDrop(qs('actorDrop'),[],'actor')}};function chooseActor(a){selectedActor=a;qs('actorInput').value=a.name;qs('actorDrop').classList.add('hidden')}
qs('connect').onclick=async()=>{
  if(!selectedMovie||!selectedActor)return msg('Choose a movie and connecting actor first.','bad');
  try{
    let r=await fetch('/api/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({puzzle_id:puzzleId,movie_id:selectedMovie.id,movie_title:selectedMovie.title,next_actor_id:selectedActor.id,actor_name:selectedActor.name})});
    let d=await r.json(); if(!r.ok)throw Error(d.error||'Validation failed');
    if(!d.valid)return msg('Invalid connection','bad');
    degree=d.degrees; current=d.current_actor;
    route.push({actor:current,movie:{id:selectedMovie.id,title:selectedMovie.title}});
    msg('Connection accepted.','ok');
    if(String(current.id)===String(target.id))return await finishRound(true);
    if(degree>=6)return await finishRound(false);
    await loadCurrent();
    if(d.dead_end){
      msg('DEAD END — No verified route reaches the target within your remaining connections. Backtrack or give up.','bad');
    }
  }catch(e){msg(e.message||'Could not validate connection.','bad')}
};
qs('back').onclick=async()=>{
  if(route.length<=1)return msg('You are already at the starting actor.','bad');
  try{let r=await fetch('/api/backtrack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({puzzle_id:puzzleId})});let d=await r.json();if(!r.ok)throw Error(d.error||'Backtrack failed');route.pop();degree=d.degrees;current=d.current_actor;hintedPath=null;msg('Backtracked. '+d.backtracks_used+' used • '+d.free_backs+' free • penalty '+(d.backtrack_penalty?'-'+d.backtrack_penalty:'0')+'.');await loadCurrent()}catch(e){msg(e.message,'bad')}
};
async function finishRound(solved,gaveUp=false){clearInterval(timer);stats();renderRoute();qs('play').classList.add('hidden');qs('result').classList.remove('hidden');let payload={puzzle_id:puzzleId,gave_up:gaveUp};let rr=await fetch('/api/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let rd=await rr.json();if(!rr.ok)throw Error(rd.error||'Could not verify result');let comparison=(rd.comparison_route||[]).map((x,i)=>(i?' → ':'')+x.movie.title+' → '+x.actor.name).join('');if(rd.solved){qs('resultTitle').textContent='Solved in '+rd.degrees+' degree'+(rd.degrees===1?'':'s');let delta=rd.degrees-rd.cut;let cutText=delta<0?'Beat The Cut by '+Math.abs(delta):(delta===0?'Made The Cut':'Over The Cut by '+delta);let deep=(rd.deep_cut_details||[]).filter(x=>x.bonus>0).map(x=>'<div>'+esc(x.movie)+' → '+esc(x.actor)+' <b>+'+x.bonus+'</b></div>').join('');qs('resultText').innerHTML='<div class="label">YOUR ROUTE</div><p><b>'+rd.degrees+' degrees</b></p><div class="label">THE CUT: '+rd.cut+'</div><p>'+esc(cutText)+'</p><div class="label">SCORE</div><p><b>'+rd.points+' points</b> • '+esc(fmt(Math.round(rd.elapsed_seconds||seconds)))+'</p><div class="label">DEEP CUTS</div><p>+'+(rd.deep_cut_bonus||0)+'</p>'+deep+'<p>Hints: '+rd.hints_used+' (−'+rd.hint_penalty+') • Backtracks: '+rd.backtracks_used+' / '+rd.free_backs+' free (−'+rd.backtrack_penalty+')</p><div class="label">'+esc(rd.comparison_label||'Verified comparison route')+' — '+rd.comparison_degrees+' degree'+(rd.comparison_degrees===1?'':'s')+'</div><p>'+esc(start.name)+(comparison?' → '+esc(comparison):'')+'</p>';}else{qs('resultTitle').textContent=gaveUp?'Round ended':'Six degrees used';qs('resultText').innerHTML='<p>Target not reached.</p>'+(comparison?'<div class="label">'+esc(rd.comparison_label||'Verified comparison route')+' — '+rd.comparison_degrees+' degree'+(rd.comparison_degrees===1?'':'s')+'</div><p>'+esc(start.name)+' → '+esc(comparison)+'</p>':'');}}
async function hint(level){return get('/api/hint?puzzle_id='+encodeURIComponent(puzzleId)+'&max='+encodeURIComponent(6-degree)+'&level='+level)}qs('hint1').onclick=async()=>{msg('Finding a verified route…');try{let h=await hint(1);hints=Math.max(hints,1);stats();msg('Hint 1 — Movie: '+h.movie.title)}catch(e){msg('Hint unavailable.','bad')}};qs('hint2').onclick=async()=>{msg('Finding a verified route…');try{let h=await hint(2);hints=Math.max(hints,2);stats();msg('Hint 2 — Connecting actor: '+h.actor.name)}catch(e){msg('Hint unavailable.','bad')}};
async function begin(difficulty){try{qs('loadTitle').textContent='Loading…';qs('loadText').textContent='Verifying a six-degree route before the puzzle starts.';document.querySelectorAll('.difficulty').forEach(b=>b.disabled=true);let st=await get('/api/status');if(!st.ready)throw Error('The game server is not configured yet.');let puzzle=await get('/api/puzzle?difficulty='+encodeURIComponent(difficulty));if(!puzzle.verified)throw Error('Puzzle verification failed.');puzzleId=puzzle.puzzle_id;start=puzzle.start;target=puzzle.target;current={id:start.id,name:start.name,profile_path:start.profile_path};degree=0;hints=0;seconds=0;route=[{actor:current,movie:null}];qs('startName').textContent=start.name;qs('targetName').textContent=target.name;qs('startPic').src=img(start.profile_path);qs('targetPic').src=img(target.profile_path);qs('loading').classList.add('hidden');['game','play','routeCard'].forEach(x=>qs(x).classList.remove('hidden'));await loadCurrent();timer=setInterval(()=>{seconds++;stats()},1000)}catch(e){qs('loadTitle').textContent='Could not start game';qs('loadText').textContent=e.message;document.querySelectorAll('.difficulty').forEach(b=>b.disabled=false)}}document.querySelectorAll('.difficulty').forEach(b=>b.onclick=()=>begin(b.dataset.difficulty));qs('giveUp').onclick=async()=>{if(confirm('Give up this round? Your current route will be submitted and the answer revealed only if the server can verify it.')){try{await finishRound(false,true)}catch(e){msg(e.message,'bad')}}};
</script></body></html>
